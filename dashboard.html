<textarea id="t"></textarea>
<button onclick="s()">Save</button>
<button onclick="a()">Ask AI</button>
<div id="r"></div>
<script>
const t = localStorage.getItem('token');
async function s() { await fetch('/notes', {method:'POST', headers:{'Content-Type':'application/json', 'Authorization':t}, body:JSON.stringify({text:document.getElementById('t').value})}); location.reload(); }
async function a() {
    const res = await fetch('/ai/summarize', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:document.getElementById('t').value})});
    const d = await res.json();
    document.getElementById('r').innerText = d.summary;
}
</script>
