<!DOCTYPE html>
<html>
<body>
    <h1>My Notes</h1>
    <textarea id="noteText" placeholder="Write a note..."></textarea><br>
    <button onclick="saveNote()">Save Note</button>
    <div id="notesList"></div>
    <br><button onclick="logout()">Logout</button>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';

        async function saveNote() {
            const text = document.getElementById('noteText').value;
            const res = await fetch('https://neura-x.onrender.com/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': token },
                body: JSON.stringify({ text })
            });
            if (res.ok) { alert('Note Saved!'); location.reload(); }
        }

        async function fetchNotes() {
            const res = await fetch('https://neura-x.onrender.com/notes', {
                headers: { 'Authorization': token }
            });
            const notes = await res.json();
            document.getElementById('notesList').innerHTML = notes.map(n => '<p>' + n.text + '</p>').join('');
        }

        function logout() { localStorage.removeItem('token'); window.location.href = '/'; }
        fetchNotes();
    </script>
</body>
</html>
