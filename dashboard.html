<!DOCTYPE html>
<html>
<body>
    <h1>My Notes</h1>
    <textarea id="noteText" placeholder="Write a note..."></textarea><br>
    <button onclick="saveNote()">Save Note</button>
    <div id="notesList"></div>
    <br><button onclick="logout()">Logout</button>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';

        async function saveNote() {
            const text = document.getElementById('noteText').value;
            await fetch('https://neura-x.onrender.com/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': token },
                body: JSON.stringify({ text })
            });
            location.reload();
        }

        async function deleteNote(id) {
            await fetch('https://neura-x.onrender.com/notes/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': token }
            });
            location.reload();
        }

        async function fetchNotes() {
            const res = await fetch('https://neura-x.onrender.com/notes', { headers: { 'Authorization': token } });
            const notes = await res.json();
            document.getElementById('notesList').innerHTML = notes.map(n => 
                '<div>' + n.text + ' <button onclick="deleteNote(\'' + n._id + '\')">Delete</button></div>'
            ).join('');
        }
        fetchNotes();
        function logout() { localStorage.removeItem('token'); window.location.href = '/'; }
    </script>
</body>
</html>
