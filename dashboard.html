<!DOCTYPE html>
<html>
<body>
    <h1>Welcome to Dashboard!</h1>
    <button onclick='logout()'>Logout</button>
    <script>
        if (!localStorage.getItem('token')) { window.location.href = '/'; }
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
