<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neura-X AI Terminal</title>
    <style>
        body { background: black; color: #00FF00; font-family: monospace; padding: 20px; }
        #chat-box { height: 300px; border: 1px solid #333; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Neura-X AI Terminal</h2>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask something..." style="width: 80%;">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input').value;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<p>User: ${input}</p>`;

            // Yahan hum Render wala URL use kar rahe hain!
            const response = await fetch('https://neura-x.onrender.com/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: input })
            });

            const data = await response.json();
            chatBox.innerHTML += `<p>Neura-X: ${data.response}</p>`;
            document.getElementById('user-input').value = '';
        }
    </script>
</body>
</html>
