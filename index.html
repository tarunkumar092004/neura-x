<!DOCTYPE html>
<html>
<body>
    <h2>Neura-X Login & Signup</h2>
    <input id="e" placeholder="Email"><br><br>
    <input id="p" type="password" placeholder="Pass"><br><br>
    <button onclick="f('/auth/login')">Login</button>
    <button onclick="f('/auth/signup')" style="margin-left: 10px;">Sign Up</button>
    <script>
        async function f(path) {
            try {
                const res = await fetch(path, {
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({email:document.getElementById('e').value, password:document.getElementById('p').value})
                });
                const d = await res.json();
                if(d.token) { 
                    localStorage.setItem('token', d.token); 
                    window.location.href='/dashboard.html'; 
                } else { 
                    alert('Server Error: ' + (d.message || 'Check logs')); 
                }
            } catch(err) {
                alert('Network Error');
            }
        }
    </script>
</body>
</html>
