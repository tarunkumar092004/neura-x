<!DOCTYPE html>
<html>
<body>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="Kuch bolo...">
    <button onclick="send()">Send</button>

    <script>
        async function send() {
            const msg = document.getElementById('input').value;
            const res = await fetch('https://neura-x.onrender.com/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            document.getElementById('chat').innerHTML += `<p>AI: ${data.response || data.error}</p>`;
            if(data.response) {
                let speech = new SpeechSynthesisUtterance(data.response);
                speech.lang = 'hi-IN';
                window.speechSynthesis.speak(speech);
            }
        }
    </script>
</body>
</html>
