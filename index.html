<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURA AI - Future Ka Sabse Smart AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #050811; --neon-blue: #00f3ff; --glass-bg: rgba(13, 20, 38, 0.6); --text-main: #e2e8f0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, #111936 0%, #050811 100%); }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-left: 1px solid rgba(0, 243, 255, 0.2); border-right: 1px solid rgba(0, 243, 255, 0.2); display: flex; flex-direction: column; }
        .header { padding: 20px; background: rgba(5, 8, 17, 0.8); border-bottom: 1px solid rgba(0, 243, 255, 0.15); text-align: center; }
        .header h1 { margin: 0; font-size: 24px; text-shadow: 0 0 10px var(--neon-blue); }
        .header p { margin: 5px 0 0 0; font-size: 11px; color: #00f3ff; letter-spacing: 1.5px; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; }
        .message.neura { background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2); align-self: flex-start; border-top-left-radius: 4px; }
        .message.user { background: linear-gradient(135deg, #00b4d8, #0077b6); align-self: flex-end; border-top-right-radius: 4px; }
        .input-container { padding: 15px; background: rgba(5, 8, 17, 0.9); border-top: 1px solid rgba(0, 243, 255, 0.15); display: flex; gap: 10px; }
        .input-box-wrapper { flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 25px; padding: 2px 15px; }
        .input-box-wrapper input { width: 100%; background: none; border: none; padding: 12px 0; color: #fff; outline: none; font-size: 15px; }
        .send-btn { background: linear-gradient(135deg, var(--neon-blue), #0077b6); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .wave-loading { display: flex; gap: 4px; }
        .wave-bar { width: 3px; height: 15px; background-color: var(--neon-blue); animation: wave 1s infinite ease-in-out; }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1.5); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>NEURA AI</h1>
        <p>Future Ka Sabse Smart AI</p>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="message neura">⚡ NEURA AI Systems Initialized. Main hoon Tarun bhai ka smart companion. Koi bhi command do!</div>
    </div>
    <div class="input-container">
        <div class="input-box-wrapper"><input type="text" id="msgInput" placeholder="Kuch bolo bhai..." autocomplete="off" onkeydown="handleKey(event)"></div>
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const chatBody = document.getElementById('chatBody');
    const msgInput = document.getElementById('msgInput');

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 1.1; utterance.rate = 1.0; utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        msgInput.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        const loadingId = 'load_' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message neura';
        loadingDiv.id = loadingId;
        loadingDiv.innerHTML = `<div class="wave-loading"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>`;
        chatBody.appendChild(loadingDiv);
        chatBody.scrollTop = chatBody.scrollHeight;

        fetch('https://neura-x.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById(loadingId).remove();
            if (data.response) {
                appendMessage(data.response, 'neura');
                speak(data.response);
            } else { appendMessage(data.error, 'neura'); }
            chatBody.scrollTop = chatBody.scrollHeight;
        })
        .catch(() => {
            document.getElementById(loadingId).remove();
            appendMessage("Core connection broken.", 'neura');
        });
    }

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatBody.appendChild(div);
    }
</script>
</body>
</html>
