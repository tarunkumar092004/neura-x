<!DOCTYPE html>
<html>
<head>
    <title>Neura-X Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; margin: 10px 0; padding: 8px; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>
    <div class='box'>
        <h2>Neura-X</h2>
        <input type='email' id='email' placeholder='Enter Email'>
        <input type='password' id='password' placeholder='Enter Password'>
        <button onclick='authAction("signup")'>Sign Up</button>
        <button onclick='authAction("login")' style='background:#28a745; margin-top:10px;'>Login</button>
    </div>
    <script>
        async function authAction(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('https://neura-x.onrender.com/auth/' + type, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                if (type === 'login') {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/dashboard.html';
                } else { alert('Registered!'); }
            } else { alert(data.error); }
        }
    </script>
</body>
</html>
