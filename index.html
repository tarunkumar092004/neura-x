<!DOCTYPE html>
<html>
<body>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="Kuch likho...">
    <button onclick="send()">Send</button>

    <script>
        async function send() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if(!msg) return;
            
            chat.innerHTML += `<p><b>Aap:</b> ${msg}</p>`;
            input.value = 'Thinking...';
            
            try {
                const res = await fetch('https://neura-x.onrender.com/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                chat.innerHTML += `<p><b>AI:</b> ${data.response}</p>`;
            } catch (err) {
                chat.innerHTML += `<p><b>Error:</b> Server se connection nahi hua.</p>`;
            }
            input.value = '';
        }
    </script>
</body>
</html>
