<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura-X Auth</title>
</head>
<body style="font-family:sans-serif; padding:20px; text-align:center;">
    <h2>Neura-X Login & Signup</h2>
    <input id="e" type="email" placeholder="Email" style="padding:10px; margin:5px; width:80%; max-width:300px;"><br>
    <input id="p" type="password" placeholder="Password" style="padding:10px; margin:5px; width:80%; max-width:300px;"><br><br>
    <button onclick="f('/auth/login')" style="padding:10px 20px; background:#007bff; color:white; border:none; cursor:pointer;">Login</button>
    <button onclick="f('/auth/signup')" style="padding:10px 20px; background:#28a745; color:white; border:none; cursor:pointer; margin-left:10px;">Sign Up</button>

    <script>
        async function f(path) {
            const email = document.getElementById('e').value;
            const password = document.getElementById('p').value;
            if(!email || !password) { alert('Email aur Password daalo bhai!'); return; }
            try {
                const res = await fetch(path, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email, password})
                });
                const d = await res.json();
                if(res.ok && d.token) {
                    localStorage.setItem('token', d.token);
                    window.location.href = '/dashboard';
                } else {
                    alert('Backend Error: ' + (d.message || d.error || JSON.stringify(d)));
                }
            } catch(err) {
                alert('Network Error: Server respond nahi kar raha!');
            }
        }
    </script>
</body>
</html>
